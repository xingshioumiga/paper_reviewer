# Copy to ``config/local.yaml`` and edit (``local.yaml`` can stay machine-specific).
# Do not put cloud API keys in files that you commit; for Ollama-only use ``api_key: ollama``.
# Optional: use ``config/my.private.yaml`` (gitignored pattern ``*.private.yaml``) for secrets if you ever need them.

input_path: private-draft.tex
output_path: output.tex
max_iterations: 1
max_no_improve: 100
log_level: INFO
log_dir: logs
ollama_healthcheck: true

llm:
  # Backend selection:
  # - "openai_compatible" (default): Standard OpenAI format, best for production/cloud APIs
  # - "ollama_native": Ollama native API with think:false support (fixes Qwen3.5 thinking mode)
  backend: openai_compatible

  base_url: http://127.0.0.1:11434/v1
  api_key: ollama

  # Example 1: Qwen2.5 series (works with both backends, no thinking mode)
  reviewer:
    model: qwen2.5:14b
    temperature: 0.1
  editor:
    model: qwen2.5:14b
    temperature: 0.7
  critic:
    model: qwen2.5:14b
    temperature: 0.0

  # Example 2: Qwen3.5 series (requires backend: ollama_native to disable thinking)
  # Uncomment below and set backend: ollama_native above:
  # reviewer:
  #   model: qwen3.5:9b
  #   temperature: 0.1
  # editor:
  #   model: qwen3.5:9b
  #   temperature: 0.7
  # critic:
  #   model: qwen3.5:9b
  #   temperature: 0.0
