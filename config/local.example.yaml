# 复制为 ``config/local.yaml`` 后编辑（可仅本机使用）/ Copy to ``config/local.yaml`` and edit (machine-specific).
# 勿将云端 API Key 提交到仓库；本机 Ollama 可用 ``api_key: ollama`` / do not commit cloud keys; use ``api_key: ollama`` for local Ollama.
# 可选：密钥放 ``config/*.private.yaml``（已在 .gitignore）/ optional secrets in ``config/*.private.yaml`` (gitignored).

input_path: sample_manuscript.tex
output_path: output.tex

# proofread = 最小订正（默认）| rewrite = 发展性重写；CLI ``--mode`` 可覆盖 / minimal edits (default) vs rewrite; CLI overrides.
mode: proofread

# If true and mode is rewrite, run.py runs a second pass in proofread (use --post-proofread to enable from CLI).
post_proofread_after_rewrite: false
post_proofread_max_iterations: 1

# Optional: override built-in system strings per mode and role (reviewer | editor | critic).
# modes:
#   rewrite:
#     editor: "Your custom editor system prompt (keep JSON output rules)..."

max_iterations: 1
max_no_improve: 100
log_level: INFO
log_dir: logs
ollama_healthcheck: true

llm:
  # Backend selection:
  # - "openai_compatible" (default): Standard OpenAI format, best for production/cloud APIs
  # - "ollama_native": Ollama native API with think:false support (fixes Qwen3.5 thinking mode)
  backend: openai_compatible

  base_url: http://127.0.0.1:11434/v1
  api_key: ollama

  # Example 1: Qwen2.5 series (works with both backends, no thinking mode)
  reviewer:
    model: qwen2.5:14b
    temperature: 0.1
  editor:
    model: qwen2.5:14b
    temperature: 0.7
  critic:
    model: qwen2.5:14b
    temperature: 0.0

  # Example 2: Qwen3.5 series (requires backend: ollama_native to disable thinking)
  # Uncomment below and set backend: ollama_native above:
  # reviewer:
  #   model: qwen3.5:9b
  #   temperature: 0.1
  # editor:
  #   model: qwen3.5:9b
  #   temperature: 0.7
  # critic:
  #   model: qwen3.5:9b
  #   temperature: 0.0
